<!DOCTYPE html>
<html>
<head>
  <title>Handoff</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
    <img src="assets/icon.jpg" alt="Handoff Logo" class="logo">

    <h1>Handoff</h1>

    <p>Pick up where you left off.</p>
</div>

<input
    type="text"
    id="project"
    placeholder="Project Name">

<textarea
    id="goal"
    placeholder="Current Goal"></textarea>

<textarea
    id="completed"
    placeholder="Completed Work"></textarea>

<textarea
    id="issue"
    placeholder="Current Issue"></textarea>

<textarea
    id="next"
    placeholder="Next Step"></textarea>

<button id="generateBtn">
    Generate Prompt
</button>

<textarea
    id="output"
    readonly
    placeholder="Generated prompt will appear here"></textarea>

<button id="copyBtn">
    Copy Prompt
</button>
  <script src="popup.js"></script>

</body>
</html>
